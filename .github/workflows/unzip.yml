name: Unzip site
on:
  push:
    paths: ['farmwise-site.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ -f farmwise-site.zip ] || exit 0
          unzip -o farmwise-site.zip
          rm -f farmwise-site.zip farmwise-preview.zip
          rm -rf __MACOSX
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack site files"
          git push
