name: Unzip site
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls *.zip >/dev/null 2>&1 || exit 0
          for z in *.zip; do unzip -o "$z"; rm -f "$z"; done
          rm -rf __MACOSX
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack site files"
          git push
